; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

; 烧录 / 调试：蓝丸配 ST-Link（SWD 四线：3V3 / GND / SWDIO / SWCLK）
upload_protocol = stlink
debug_tool = stlink

; 这块板子实际是 CKS32F103 克隆片，SWD IDCODE = 0x2ba01477（正品 ST 是 0x1ba01477）。
; CPUTAPID 必须在 target/stm32f1x.cfg 加载前设置，所以用 -c 提前注入，
; 让 OpenOCD 把期望 ID 改成克隆片的号，否则 init 阶段就拒绝连接。
upload_flags =
    -c
    set CPUTAPID 0x2ba01477

; 串口监视器波特率，以后接蓝牙 / 串口调试用
monitor_speed = 115200

; printf 浮点支持：newlib-nano 默认把浮点格式化砍掉了（省空间）。
; 不加这句，printf("%.2f") 打印出来是一段空白，特别容易被误认为是"变量算出来是 0"。
; 写法说明：build_flags 是按空格拆成一个一个 flag 的，"-u _printf_float" 会被拆成
; 两个 flag（后半个被当成库名去找），所以必须用 -Wl, 逗号连写，整体算一个 flag。
build_flags =
    -Wl,-u,_printf_float